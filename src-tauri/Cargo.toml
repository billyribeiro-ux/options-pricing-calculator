[package]
name = "optionsquant"
version = "1.0.0"
description = "Options Pricing and Iron Condor Calculator"
authors = ["OptionsQuant Team"]
edition = "2021"

[lib]
name = "optionsquant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
